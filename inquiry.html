      <span></span><span></span><span></span>
    </button>

<!-- Page Hero -->
<section class="page-hero">
  <div class="container">
    <p class="hero-eyebrow">INQUIRY</p>
    <h1>수업문의</h1>
    <p class="page-hero-desc">아래 정보를 남겨주시면 확인 후 빠르게 연락드리겠습니다.</p>
  </div>
</section>

<!-- Inquiry Form -->
<section class="section">
  <div class="container">
    <form class="inquiry-form" id="inquiryForm">
      <div class="form-row">
        <div class="form-label">이름<span class="required">*</span></div>
        <div class="form-field">
          <input type="text" id="f_name" name="f_name" placeholder="학생 이름을 입력해주세요" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">나이<span class="required">*</span></div>
        <div class="form-field">
          <input type="number" id="f_age" name="f_age" placeholder="만 나이" min="1" max="19" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">연락처<span class="required">*</span></div>
        <div class="form-field">
          <input type="tel" id="f_phone" name="f_phone" placeholder="010-1234-5678" pattern="[0-9\-]{9,13}" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">희망시간<span class="required">*</span></div>
        <div class="form-field">
          <select id="f_time" name="f_time" required>
            <option value="" disabled selected>선택해주세요</option>
            <option value="1부 (2:00~2:50) 초등부 1,2학년">1부 (2:00~2:50) 초등부 1,2학년</option>
            <option value="2부 (3:30~4:20) 유치부/초등부 저학년">2부 (3:30~4:20) 유치부/초등부 저학년</option>
            <option value="3부 (5:00~5:50) 유치부/초등부 저학년">3부 (5:00~5:50) 유치부/초등부 저학년</option>
            <option value="4부 (6:30~7:20) 초등부 고학년/유품자">4부 (6:30~7:20) 초등부 고학년/유품자</option>
            <option value="5부 (8:00~8:50) 중,고등부">5부 (8:00~8:50) 중,고등부</option>
            <option value="상담 후 결정">상담 후 결정할게요</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">픽업여부<span class="required">*</span></div>
        <div class="form-field">
          <div class="radio-group">
            <label><input type="radio" name="f_pickup" value="픽업 필요" required> 필요</label>
            <label><input type="radio" name="f_pickup" value="픽업 불필요" required> 불필요</label>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">전달사항</div>
        <div class="form-field">
          <textarea id="f_message" name="f_message" placeholder="궁금하신 점이나 전달하실 내용을 자유롭게 남겨주세요 (선택)"></textarea>
        </div>
      </div>
      <label class="form-consent">
        <input type="checkbox" required>
        <span>(필수) 입력하신 정보는 상담 목적으로만 사용되며, 별도로 저장되지 않고 문의 접수를 위해 바로 전송됩니다.</span>
      </label>
      <div class="form-submit-wrap">
        <button type="submit" class="btn btn-primary btn-lg">상담 신청하기</button>
      </div>
    </form>
  </div>
</section>
