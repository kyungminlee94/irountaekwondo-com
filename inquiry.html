<!-- Page Hero -->

    <p class="hero-eyebrow">INQUIRY</p>

    <p class="page-hero-desc">아래 정보를 남겨주시면 확인 후 빠르게 연락드리겠습니다.</p>
  </div>
</section>

<!-- Inquiry Form -->
<section class="section">
  <div class="container">
    <form class="inquiry-form" id="inquiryForm" action="https://formspree.io/f/xljeprnp" method="POST">
      <div class="form-row">
        <div class="form-label">학생이름<span class="required">*</span></div>
        <div class="form-field">
          <input type="text" id="f_name" name="학생이름" placeholder="학생 이름을 입력해주세요" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">학부모연락처<span class="required">*</span></div>
        <div class="form-field">
          <input type="tel" id="f_phone" name="학부모연락처" placeholder="010-1234-5678" pattern="[0-9\-]{9,13}" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">학교<span class="required">*</span></div>
        <div class="form-field">
          <input type="text" id="f_school" name="학교" placeholder="예) 삼숭초등학교, OO유치원" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">주소<span class="required">*</span></div>
        <div class="form-field">
          <input type="text" id="f_address" name="주소" placeholder="거주하시는 동/아파트 등을 입력해주세요" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">문의내용</div>
        <div class="form-field">
          <textarea id="f_message" name="문의내용" placeholder="궁금하신 점이나 전달하실 내용을 자유롭게 남겨주세요 (선택)"></textarea>
        </div>
      </div>
      <label class="form-consent">
        <input type="checkbox" required>
        <span>(필수) 입력하신 정보는 상담 목적으로만 사용되며, 별도로 저장되지 않고 문의 접수를 위해 바로 전송됩니다.</span>
      </label>
      <div class="form-submit-wrap">
        <button type="submit" class="btn btn-primary btn-lg">상담 신청하기</button>
      </div>
      <p class="form-success" id="formSuccess" hidden>신청이 접수되었습니다. 확인 후 빠른 시일 내에 전화드리겠습니다 :)</p>
    </form>
  </div>
</section>
