<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- background badge -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#ffffff" stroke="#c8102e" stroke-width="3"/>

  <!-- left head (pink) -->
  <circle cx="22" cy="27" r="13.5" fill="#ff9fc4"/>
  <!-- right head (blue) -->
  <circle cx="42" cy="27" r="13.5" fill="#7ecbe8"/>

  <!-- small heart between heads -->
  <g fill="#c8102e">
    <circle cx="28.5" cy="9.5" r="3.4"/>
    <circle cx="35.5" cy="9.5" r="3.4"/>
    <polygon points="24.5,11 39.5,11 32,20"/>
  </g>

  <!-- headbands -->
  <rect x="9" y="21" width="26" height="5.4" rx="2.7" fill="#ffffff" transform="rotate(-6 22 24)"/>
  <rect x="29" y="21" width="26" height="5.4" rx="2.7" fill="#ffffff" transform="rotate(6 42 24)"/>
  <circle cx="16" cy="21.5" r="2.6" fill="#e8558f" transform="rotate(-6 22 24)"/>
  <circle cx="48" cy="21.5" r="2.6" fill="#3f9fcf" transform="rotate(6 42 24)"/>

  <!-- eyes -->
  <circle cx="18" cy="29" r="2.1" fill="#141312"/>
  <circle cx="26" cy="29" r="2.1" fill="#141312"/>
  <circle cx="38" cy="29" r="2.1" fill="#141312"/>
  <circle cx="46" cy="29" r="2.1" fill="#141312"/>

  <!-- cheeks -->
  <circle cx="15" cy="33.5" r="2.3" fill="#ff6f9b" opacity="0.6"/>
  <circle cx="29" cy="33.5" r="2.3" fill="#ff6f9b" opacity="0.6"/>
  <circle cx="35" cy="33.5" r="2.3" fill="#57b8e0" opacity="0.6"/>
  <circle cx="49" cy="33.5" r="2.3" fill="#57b8e0" opacity="0.6"/>

  <!-- crossed arms (taekwondo ready stance) -->
  <g stroke="#141312" stroke-width="6.4" stroke-linecap="round">
    <line x1="13" y1="46" x2="51" y2="59"/>
    <line x1="51" y1="46" x2="13" y2="59"/>
  </g>
  <circle cx="13" cy="46" r="4" fill="#ff9fc4"/>
  <circle cx="51" cy="46" r="4" fill="#7ecbe8"/>
  <circle cx="13" cy="59" r="4" fill="#7ecbe8"/>
  <circle cx="51" cy="59" r="4" fill="#ff9fc4"/>
</svg>
